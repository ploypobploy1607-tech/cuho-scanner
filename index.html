<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CUHO SHOP — สแกนขาย</title>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f5f7f6;font-family:Arial,sans-serif;color:#222}.wrap{max-width:520px;margin:auto}.head{background:#176b4d;color:#fff;padding:18px;border-radius:16px;text-align:center}.head h1{margin:0;font-size:23px}.head p{margin:6px 0 0}.card{background:#fff;padding:15px;border-radius:16px;margin-top:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:8px;font-size:17px;font-weight:700}button.green{background:#176b4d;color:#fff}button.red{background:#d15b55;color:#fff}button.dark{background:#333;color:#fff}button.orange{background:#df9b20;color:#fff}input{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:18px;margin-top:6px}label{display:block;font-weight:700;margin-top:8px}video{width:100%;height:300px;background:#000;border-radius:14px;object-fit:cover;margin-top:12px;display:none}.info{display:none;line-height:1.8}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:5px 0}.value{font-weight:700}.status{padding:12px;border-radius:10px;text-align:center;background:#eef5f1;margin-top:10px;font-weight:700}.ok{background:#dff4e7;color:#176b4d}.err{background:#fde1e1;color:#b3261e}.order{background:#fff7dc;padding:13px;border-radius:12px;text-align:center;font-weight:700}.small{text-align:center;color:#777;font-size:13px;margin-top:8px}.urlbox{font-size:12px;word-break:break-all;background:#f1f1f1;padding:8px;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><h1>👟 CUHO SHOP</h1><p>ระบบสแกนขาย</p></div>
<div class="card">
<button class="green" id="start" onclick="startCamera()">📷 เปิดกล้องสแกนบาร์โค้ด</button>
<button class="red" id="stop" onclick="stopCamera()" style="display:none">⛔ ปิดกล้อง</button>
<video id="video" autoplay muted playsinline></video>
<div class="small">ส่องบาร์โค้ด เช่น CU000001</div>
</div>
<div class="card"><label>บาร์โค้ด</label><input id="barcode" placeholder="เช่น CU000001" autocomplete="off"><button class="green" onclick="lookup()">🔍 ตรวจสอบรองเท้า</button></div>
<div class="card info" id="info"><h3>ข้อมูลรองเท้า</h3><div class="row"><span>Barcode</span><span id="b" class="value"></span></div><div class="row"><span>แบรนด์</span><span id="brand" class="value"></span></div><div class="row"><span>ไซซ์</span><span id="size" class="value"></span></div><div class="row"><span>ประเภทต้นทุน</span><span id="type" class="value"></span></div><div class="row"><span>ต้นทุนเฉลี่ย</span><span id="cost" class="value"></span></div><div class="row"><span>สถานะ</span><span id="stat" class="value"></span></div><div id="pstat" class="status"></div></div>
<div class="card" id="sale" style="display:none"><label>ราคาปิดขาย</label><input id="price" type="number" inputmode="numeric" placeholder="เช่น 690"><button class="orange" onclick="save()">💰 บันทึกขาย</button></div>
<div class="card"><div class="order">🛒 ออเดอร์ปัจจุบัน<div id="ord">ยังไม่มีรายการ</div></div><button class="dark" onclick="finish()">✅ จบออเดอร์</button></div>
<div id="msg" class="status">พร้อมใช้งาน</div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbxfZ3buqcYAErHM6o9rzFZh0Y9MHf90sw9WjqRo34RdjXY6kRR1AQLLa0FY3NICtuOS/exec';
let reader=null,stream=null,scanning=false;
function msg(t,e=false){const x=document.getElementById('msg');x.textContent=t;x.className='status '+(e?'err':'');}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='cuho_cb_'+Date.now()+'_'+Math.floor(Math.random()*9999);const s=document.createElement('script');const q=new URLSearchParams({...params,callback:cb});s.src=API+'?'+q.toString();let timer=setTimeout(()=>{cleanup();reject(new Error('เชื่อมต่อ CUHO SHOP ไม่สำเร็จ'))},15000);window[cb]=d=>{clearTimeout(timer);cleanup();resolve(d)};s.onerror=()=>{clearTimeout(timer);cleanup();reject(new Error('เชื่อมต่อระบบไม่ได้'))};document.body.appendChild(s);function cleanup(){delete window[cb];s.remove()}})}
async function startCamera(){try{msg('กำลังเปิดกล้อง...');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=document.getElementById('video');v.srcObject=stream;v.style.display='block';await v.play();document.getElementById('start').style.display='none';document.getElementById('stop').style.display='block';scanning=true;if(!reader)reader=new ZXingBrowser.BrowserMultiFormatReader();reader.decodeFromVideoElement(v,(r,e)=>{if(scanning&&r){document.getElementById('barcode').value=r.getText().trim();stopCamera();lookup()}});msg('✅ กล้องพร้อมสแกน')}catch(e){console.error(e);msg(e.name==='NotAllowedError'?'❌ ยังไม่ได้อนุญาตให้ใช้กล้อง':e.name==='NotFoundError'?'❌ ไม่พบกล้อง':e.name==='NotReadableError'?'❌ กล้องถูกใช้งานอยู่':('❌ เปิดกล้องไม่ได้: '+e.name),true)}}
function stopCamera(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}const v=document.getElementById('video');v.srcObject=null;v.style.display='none';document.getElementById('start').style.display='block';document.getElementById('stop').style.display='none';if(reader)try{reader.reset()}catch(e){}}
async function lookup(){const bc=document.getElementById('barcode').value.trim();if(!bc){msg('กรุณาสแกน Barcode ก่อน',true);return}msg('กำลังค้นหา...');try{const p=await jsonp({action:'lookup',barcode:bc});if(!p.ok){document.getElementById('info').style.display='none';document.getElementById('sale').style.display='none';msg('❌ '+p.message,true);return}document.getElementById('info').style.display='block';document.getElementById('b').textContent=p.barcode||'-';document.getElementById('brand').textContent=p.brand||'-';document.getElementById('size').textContent=p.size||'-';document.getElementById('type').textContent=p.type||'-';document.getElementById('cost').textContent=(Number(p.cost)||0).toLocaleString()+' บาท';document.getElementById('stat').textContent=p.status||'-';const ps=document.getElementById('pstat');if(p.status==='ขายแล้ว'){ps.className='status err';ps.textContent='❌ รองเท้าคู่นี้ขายแล้ว';document.getElementById('sale').style.display='none';msg('รองเท้าคู่นี้ขายแล้ว',true);return}if(p.status&&p.status!=='คงเหลือ'){ps.className='status err';ps.textContent='❌ สินค้าไม่พร้อมขาย';document.getElementById('sale').style.display='none';return}ps.className='status ok';ps.textContent='✅ พร้อมขาย';document.getElementById('sale').style.display='block';document.getElementById('price').focus();msg('พบสินค้าแล้ว กรุณาใส่ราคาปิด')}catch(e){msg('❌ '+e.message,true)}}
async function save(){const bc=document.getElementById('barcode').value.trim();const price=Number(document.getElementById('price').value);if(!bc){msg('ไม่มี Barcode',true);return}if(!(price>0)){msg('กรุณาใส่ราคาปิดขาย',true);return}msg('กำลังบันทึก...');try{const r=await jsonp({action:'save',barcode:bc,price:price});if(!r.ok){msg('❌ '+r.message,true);return}msg('✅ '+r.message+' | '+bc+' | '+price.toLocaleString()+' บาท');document.getElementById('ord').textContent='มีรายการขายแล้ว';document.getElementById('barcode').value='';document.getElementById('price').value='';document.getElementById('info').style.display='none';document.getElementById('sale').style.display='none';document.getElementById('barcode').focus()}catch(e){msg('❌ '+e.message,true)}}
async function finish(){if(!confirm('ต้องการจบออเดอร์นี้ใช่ไหม?'))return;msg('กำลังจบออเดอร์...');try{const r=await jsonp({action:'finish'});if(!r.ok){msg('❌ '+r.message,true);return}msg('✅ '+r.message);document.getElementById('ord').textContent='ยังไม่มีรายการ'}catch(e){msg('❌ '+e.message,true)}}
document.getElementById('barcode').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();lookup()}});document.getElementById('price').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save()}});
</script>
</body></html>
