<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>CUHO SHOP — สแกนขาย</title>

<!-- ZXing Barcode Scanner -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:16px;
  background:#f5f7f6;
  font-family:Arial,sans-serif;
  color:#222;
}

.wrap{
  max-width:520px;
  margin:auto;
}

.head{
  background:#176b4d;
  color:white;
  padding:20px;
  border-radius:18px;
  text-align:center;
}

.head h1{
  margin:0;
  font-size:25px;
}

.head p{
  margin:7px 0 0;
  font-size:18px;
}

.card{
  background:white;
  padding:16px;
  border-radius:18px;
  margin-top:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px;
  margin-top:8px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.green{
  background:#176b4d;
  color:white;
}

.red{
  background:#d15b55;
  color:white;
}

.dark{
  background:#333;
  color:white;
}

.orange{
  background:#df9b20;
  color:white;
}

input{
  width:100%;
  padding:15px;
  border:1px solid #ccc;
  border-radius:11px;
  font-size:20px;
  margin-top:7px;
}

label{
  display:block;
  font-weight:bold;
  font-size:18px;
  margin-top:8px;
}

video{
  width:100%;
  height:320px;
  background:#000;
  border-radius:15px;
  margin-top:12px;
  display:none;
  object-fit:cover;
}

.small{
  text-align:center;
  color:#777;
  font-size:15px;
  margin-top:10px;
}

.info{
  display:none;
}

.row{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #eee;
  padding:7px 0;
  gap:15px;
}

.value{
  font-weight:bold;
  text-align:right;
}

.status{
  padding:13px;
  border-radius:11px;
  text-align:center;
  background:#eef5f1;
  margin-top:10px;
  font-weight:bold;
}

.ok{
  background:#dff4e7;
  color:#176b4d;
}

.err{
  background:#fde1e1;
  color:#b3261e;
}

.order{
  background:#fff7dc;
  padding:15px;
  border-radius:13px;
  text-align:center;
  font-weight:bold;
  font-size:17px;
}

#sale{
  display:none;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="head">
    <h1>👟 CUHO SHOP</h1>
    <p>ระบบสแกนขาย</p>
  </div>


  <!-- CAMERA -->
  <div class="card">

    <button
      class="green"
      id="start"
      onclick="startCamera()">
      📷 เปิดกล้องสแกนบาร์โค้ด
    </button>

    <button
      class="red"
      id="stop"
      onclick="stopCamera()"
      style="display:none">
      ⛔ ปิดกล้อง
    </button>

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <div class="small">
      ส่องบาร์โค้ด เช่น CU000001
    </div>

  </div>


  <!-- BARCODE -->
  <div class="card">

    <label>บาร์โค้ด</label>

    <input
      id="barcode"
      placeholder="เช่น CU000001"
      autocomplete="off">

    <button
      class="green"
      onclick="lookup()">
      🔍 ตรวจสอบรองเท้า
    </button>

  </div>


  <!-- PRODUCT INFO -->
  <div
    class="card info"
    id="info">

    <h3>ข้อมูลรองเท้า</h3>

    <div class="row">
      <span>Barcode</span>
      <span id="b" class="value"></span>
    </div>

    <div class="row">
      <span>แบรนด์</span>
      <span id="brand" class="value"></span>
    </div>

    <div class="row">
      <span>ไซซ์</span>
      <span id="size" class="value"></span>
    </div>

    <div class="row">
      <span>ประเภทต้นทุน</span>
      <span id="type" class="value"></span>
    </div>

    <div class="row">
      <span>ต้นทุนเฉลี่ย</span>
      <span id="cost" class="value"></span>
    </div>

    <div class="row">
      <span>สถานะ</span>
      <span id="stat" class="value"></span>
    </div>

    <div id="pstat" class="status"></div>

  </div>


  <!-- SALE -->
  <div
    class="card"
    id="sale">

    <label>ราคาปิดขาย</label>

    <input
      id="price"
      type="number"
      inputmode="numeric"
      placeholder="เช่น 690">

    <button
      class="orange"
      onclick="save()">
      💰 บันทึกขาย
    </button>

  </div>


  <!-- ORDER -->
  <div class="card">

    <div class="order">

      🛒 ออเดอร์ปัจจุบัน

      <div id="ord">
        ยังไม่มีรายการ
      </div>

    </div>

    <button
      class="dark"
      onclick="finish()">
      ✅ จบออเดอร์
    </button>
    <button
  class="undo"
  onclick="undoLatest()">
  ↩️ ยกเลิกรายการล่าสุด
</button>

  </div>


  <!-- MESSAGE -->
  <div
    id="msg"
    class="status">
    กำลังเตรียมระบบ...
  </div>

</div>


<script>

/* =====================================================
   CUHO SHOP API
   ===================================================== */

const API='https://script.google.com/macros/s/AKfycbyIzgxvpMeW-e-qoBDKjuOtAX2NzEXYxAtyLYEu2gqFV3LTI3TFKbbJ4tim5qfbxSelJQ/exec';
  function undoLatest(){

  if(!confirm(
    '↩️ ยืนยันยกเลิกรายการขายล่าสุด?\n\n' +
    'ระบบจะคืนสถานะรองเท้าคู่นั้นเป็น "คงเหลือ"'
  )){
    return;
  }

  msg('กำลังยกเลิกรายการล่าสุด...');

  var callbackName =
    'cuhoUndo_' + Date.now();

  window[callbackName] = function(r){

    try{

      if(r && r.ok){

        msg(
          '↩️ ยกเลิกรายการล่าสุดเรียบร้อย\n' +
          'Barcode: ' + (r.barcode || '-') +
          '\nราคาขาย: ' + (r.price || 0) + ' บาท'
        );

        alert(
          '↩️ ยกเลิกรายการเรียบร้อยแล้ว\n\n' +
          'Barcode: ' + (r.barcode || '-') +
          '\nสถานะคืนเป็น: คงเหลือ'
        );

      }else{

        msg(
          '❌ ' +
          (r && r.message
            ? r.message
            : 'ยกเลิกรายการไม่สำเร็จ'),
          true
        );

        alert(
          '❌ ยกเลิกไม่สำเร็จ\n\n' +
          (r && r.message
            ? r.message
            : 'ไม่ทราบสาเหตุ')
        );

      }

    }finally{

      delete window[callbackName];

      if(script && script.parentNode){
        script.parentNode.removeChild(script);
      }

    }

  };

  var script = document.createElement('script');

  script.src =
    API +
    '?action=undo' +
    '&callback=' +
    encodeURIComponent(callbackName);

  script.onerror = function(){

    delete window[callbackName];

    if(script.parentNode){
      script.parentNode.removeChild(script);
    }

    msg('❌ เชื่อมต่อระบบไม่ได้', true);

    alert('❌ เชื่อมต่อระบบไม่ได้');

  };

  document.body.appendChild(script);

}


/* =====================================================
   VARIABLES
   ===================================================== */

let reader = null;
let stream = null;
let scanning = false;


/* =====================================================
   MESSAGE
   ===================================================== */

function msg(text, error=false){

  const box = document.getElementById('msg');

  box.textContent = text;

  box.className =
    'status ' +
    (error ? 'err' : '');

}


/* =====================================================
   WAIT FOR ZXING
   ===================================================== */

function waitForZXing(){

  return new Promise(function(resolve,reject){

    let count = 0;

    const timer = setInterval(function(){

      count++;

      if(
        window.ZXingBrowser &&
        typeof window.ZXingBrowser.BrowserMultiFormatReader
        === 'function'
      ){

        clearInterval(timer);

        resolve();

        return;
      }


      if(count >= 100){

        clearInterval(timer);

        reject(
          new Error(
            'ตัวอ่านบาร์โค้ดโหลดไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ'
          )
        );

      }

    },100);

  });

}


/* =====================================================
   START CAMERA
   ===================================================== */

async function startCamera(){

  try{

    msg('กำลังเตรียมตัวอ่านบาร์โค้ด...');

    await waitForZXing();


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        'เบราว์เซอร์ไม่รองรับการใช้กล้อง'
      );

    }


    msg('กำลังเปิดกล้อง...');


    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:'environment'
          },

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          }

        },

        audio:false

      });


    const video =
      document.getElementById('video');


    video.srcObject = stream;

    video.style.display = 'block';


    await video.play();


    document.getElementById('start')
      .style.display='none';


    document.getElementById('stop')
      .style.display='block';


    scanning = true;


    /*
      สร้าง Barcode Reader
      ไม่มี DecodeHintType
    */

    if(!reader){

      reader =
        new ZXingBrowser.BrowserMultiFormatReader();

    }


    msg(
      '✅ กล้องพร้อมสแกน — วางบาร์โค้ดไว้กลางภาพ'
    );


    reader.decodeFromVideoElement(

      video,

      function(result, error){

        if(!scanning){
          return;
        }


        if(result){

          const code =
            result.getText().trim();


          if(code){

            document.getElementById(
              'barcode'
            ).value = code;


            stopCamera();


            lookup();

          }

        }

      }

    );


  }
  catch(error){

    console.error(error);

    msg(
      '❌ ' +
      (
        error.message ||
        error.name ||
        'เปิดกล้องไม่ได้'
      ),
      true
    );

  }

}


/* =====================================================
   STOP CAMERA
   ===================================================== */

function stopCamera(){

  scanning = false;


  if(stream){

    stream
      .getTracks()
      .forEach(function(track){

        track.stop();

      });

    stream = null;

  }


  const video =
    document.getElementById('video');


  video.srcObject = null;

  video.style.display = 'none';


  document.getElementById('start')
    .style.display='block';


  document.getElementById('stop')
    .style.display='none';


  if(reader){

    try{

      reader.reset();

    }
    catch(e){}

  }

}


/* =====================================================
   JSONP
   ===================================================== */

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb='cuho_cb_'+Date.now()+'_'+Math.floor(Math.random()*999999);

    const script=document.createElement('script');

    const query=new URLSearchParams(params);
    query.set('callback',cb);

    script.src=API+'?'+query.toString();
    script.async=true;

    let finished=false;

    const timer=setTimeout(()=>{
      if(finished)return;
      finished=true;
      cleanup();
      reject(new Error('เชื่อมต่อระบบไม่ได้ — API ไม่ตอบกลับ'));
    },20000);

    window[cb]=function(data){
      if(finished)return;

      finished=true;
      clearTimeout(timer);
      cleanup();

      resolve(data);
    };

    script.onerror=function(){
      if(finished)return;

      finished=true;
      clearTimeout(timer);
      cleanup();

      reject(new Error('เชื่อมต่อระบบไม่ได้'));
    };

    function cleanup(){
      delete window[cb];

      if(script.parentNode){
        script.parentNode.removeChild(script);
      }
    }

    document.body.appendChild(script);
  });
}


/* =====================================================
   LOOKUP PRODUCT
   ===================================================== */

async function lookup(){

  const barcode =
    document
      .getElementById('barcode')
      .value
      .trim();


  if(!barcode){

    msg(
      'กรุณาสแกน Barcode ก่อน',
      true
    );

    return;

  }


  msg('กำลังค้นหารองเท้า...');


  try{

    const product =
      await jsonp({

        action:'lookup',

        barcode:barcode

      });


    if(!product.ok){

      document
        .getElementById('info')
        .style.display='none';


      document
        .getElementById('sale')
        .style.display='none';


      msg(
        '❌ ' +
        product.message,
        true
      );

      return;

    }


    document
      .getElementById('info')
      .style.display='block';


    document
      .getElementById('b')
      .textContent =
      product.barcode || '-';


    document
      .getElementById('brand')
      .textContent =
      product.brand || '-';


    document
      .getElementById('size')
      .textContent =
      product.size || '-';


    document
      .getElementById('type')
      .textContent =
      product.type || '-';


    document
      .getElementById('cost')
      .textContent =
      (
        Number(product.cost) || 0
      ).toLocaleString() +
      ' บาท';


    document
      .getElementById('stat')
      .textContent =
      product.status || '-';


    const status =
      document.getElementById('pstat');


    if(product.status === 'ขายแล้ว'){

      status.className =
        'status err';

      status.textContent =
        '❌ รองเท้าคู่นี้ขายแล้ว';


      document
        .getElementById('sale')
        .style.display='none';


      msg(
        'รองเท้าคู่นี้ขายแล้ว',
        true
      );

      return;

    }


    if(
      product.status &&
      product.status !== 'คงเหลือ'
    ){

      status.className =
        'status err';

      status.textContent =
        '❌ สินค้าไม่พร้อมขาย';


      document
        .getElementById('sale')
        .style.display='none';


      return;

    }


    status.className =
      'status ok';


    status.textContent =
      '✅ พร้อมขาย';


    document
      .getElementById('sale')
      .style.display='block';


    document
      .getElementById('price')
      .focus();


    msg(
      'พบสินค้าแล้ว กรุณาใส่ราคาปิดขาย'
    );

  }
  catch(error){

    msg(
      '❌ ' +
      error.message,
      true
    );

  }

}


/* =====================================================
   SAVE SALE
   ===================================================== */

async function save(){

  const barcode =
    document
      .getElementById('barcode')
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById('price')
        .value
    );


  if(!barcode){

    msg(
      'ไม่มี Barcode',
      true
    );

    return;

  }


  if(!(price > 0)){

    msg(
      'กรุณาใส่ราคาปิดขาย',
      true
    );

    return;

  }


  msg('กำลังบันทึกการขาย...');


  try{

    const result =
      await jsonp({

        action:'save',

        barcode:barcode,

        price:price

      });


    if(!result.ok){

      msg(
        '❌ ' +
        result.message,
        true
      );

      return;

    }


    msg(
      '✅ ' +
      result.message +
      ' | ' +
      barcode +
      ' | ' +
      price.toLocaleString() +
      ' บาท'
    );


    document
      .getElementById('ord')
      .textContent =
      'มีรายการขายแล้ว';


    document
      .getElementById('barcode')
      .value='';


    document
      .getElementById('price')
      .value='';


    document
      .getElementById('info')
      .style.display='none';


    document
      .getElementById('sale')
      .style.display='none';


    document
      .getElementById('barcode')
      .focus();

  }
  catch(error){

    msg(
      '❌ ' +
      error.message,
      true
    );

  }

}


/* =====================================================
   FINISH ORDER
   ===================================================== */

async function finish(){

  if(
    !confirm(
      'ต้องการจบออเดอร์นี้ใช่ไหม?'
    )
  ){

    return;

  }


  msg('กำลังจบออเดอร์...');


  try{

    const result =
      await jsonp({

        action:'finish'

      });


    if(!result.ok){

      msg(
        '❌ ' +
        result.message,
        true
      );

      return;

    }


    msg(
      '✅ ' +
      result.message
    );


    document
      .getElementById('ord')
      .textContent =
      'ยังไม่มีรายการ';

  }
  catch(error){

    msg(
      '❌ ' +
      error.message,
      true
    );

  }

}


/* =====================================================
   ENTER KEY
   ===================================================== */

document
  .getElementById('barcode')
  .addEventListener(
    'keydown',
    function(event){

      if(event.key === 'Enter'){

        event.preventDefault();

        lookup();

      }

    }
  );


document
  .getElementById('price')
  .addEventListener(
    'keydown',
    function(event){

      if(event.key === 'Enter'){

        event.preventDefault();

        save();

      }

    }
  );


/* =====================================================
   PAGE READY
   ===================================================== */

window.addEventListener(
  'load',
  function(){

    if(
      window.ZXingBrowser &&
      typeof window.ZXingBrowser.BrowserMultiFormatReader
      === 'function'
    ){

      msg(
        '✅ ระบบพร้อมใช้งาน'
      );

    }
    else{

      msg(
        '⚠️ กำลังโหลดตัวอ่านบาร์โค้ด...',
        false
      );

    }

  }
);

</script>

</body>
</html>
